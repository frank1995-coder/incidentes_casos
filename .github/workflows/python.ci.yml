name: CI Pipeline

on:
  push:
    branches: [ developer, staging ]
  pull_request:
    branches: [ developer, staging ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar todas las pruebas (unitarias, regresión, e2e) con cobertura
        run: coverage run -m pytest test/
      - name: Verificar cobertura >= 80%
        run: coverage report -m --fail-under=80